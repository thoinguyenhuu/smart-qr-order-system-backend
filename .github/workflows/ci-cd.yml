name: CI/CD

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash mvnw -B --no-transfer-progress verify

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DOCKER_IMAGE: thoinguyenhuu/smart-qr-backend
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t "$DOCKER_IMAGE:$IMAGE_TAG" -t "$DOCKER_IMAGE:latest" .
          docker push "$DOCKER_IMAGE:$IMAGE_TAG"
          docker push "$DOCKER_IMAGE:latest"
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: IMAGE_TAG,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            docker compose pull backend
            docker compose up -d --no-deps --no-build --wait --wait-timeout 180 backend
